<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>代理后台入口</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f7fa;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 48px;text-align:center;max-width:420px;width:90%}
  h2{margin:0 0 12px;color:#1f2329}
  p{color:#646a73;font-size:15px;line-height:1.6;margin:8px 0}
  .spin{display:inline-block;width:28px;height:28px;border:3px solid #e5e6eb;border-top-color:#3370ff;border-radius:50%;animation:r 1s linear infinite;margin-bottom:12px}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#3370ff}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h2>正在进入代理后台…</h2>
  <p id="status">正在获取最新地址…</p>
  <p id="link"></p>
</div>
<script>
(function(){
  var status = document.getElementById('status');
  var linkEl = document.getElementById('link');
  var ts = Date.now();
  // 通道1：GitHub API（实时、权威）
  function fromApi(){
    return fetch('https://api.github.com/repos/woaiyudian/agent-redirect/contents/current.txt?t=' + ts, {cache:'no-store'})
      .then(function(r){ if(!r.ok){ throw new Error('api ' + r.status); } return r.json(); })
      .then(function(d){ return atob((d.content || '').replace(/\s+/g, '')).trim(); });
  }
  // 通道2：GitHub Pages 的 current.txt（国内访问更稳，可能最多滞后10分钟）
  function fromPage(){
    return fetch('https://woaiyudian.github.io/agent-redirect/current.txt?t=' + ts, {cache:'no-store'})
      .then(function(r){ if(!r.ok){ throw new Error('page ' + r.status); } return r.text(); })
      .then(function(t){ return t.trim(); });
  }
  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
  }
  withTimeout(fromApi(), 6000)
    .catch(function(){ return withTimeout(fromPage(), 6000); })
    .then(function(u){
      if(!/^https?:\/\/\S+$/.test(u)){ throw new Error('bad url'); }
      location.href = u;
    })
    .catch(function(){
      status.textContent = '获取最新地址失败，请稍后刷新重试。';
      linkEl.innerHTML = '如果长时间无法打开，请到电脑端查看当前地址。';
    });
})();
</script>
</body>
</html>
